<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pi Market</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f5fa;color:#222}
header{background:#432080;color:white;padding:22px 16px}
header h1{font-size:27px}
header p{margin-top:6px;color:#e5dafa}
.search{padding:15px}
.search input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px}
.categories{display:flex;gap:10px;overflow:auto;padding:0 15px 15px}
.categories button{padding:10px 16px;border:0;border-radius:20px;background:#e5dcf5;color:#432080;white-space:nowrap}
.categories button.active{background:#432080;color:white}
h2{padding:10px 15px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;padding:15px}
.product{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0001}
.product img{width:100%;height:135px;object-fit:cover}
.info{padding:11px}
.info h3{font-size:16px;margin-bottom:7px}
.price{color:#432080;font-weight:bold;margin-bottom:10px}
.product button,.back,.contact{background:#432080;color:white;border:0;padding:11px;border-radius:7px;width:100%;cursor:pointer}
.details{display:none;padding:18px}
.details img{width:100%;max-height:270px;object-fit:cover;border-radius:12px}
.details h2{padding:15px 0}
.details p{line-height:1.6;margin:10px 0}
footer{text-align:center;background:#432080;color:white;padding:20px;margin-top:20px}
</style>
</head>

<body>

<header>
<h1>π Pi Market</h1>
<p>Your Marketplace. Buy and Sell Easily.</p>
</header>

<div id="home">
<div class="search">
<input type="text" id="search" placeholder="Search products..." oninput="searchProducts()">
</div>

<div class="categories">
<button class="active" onclick="filterProducts('All',this)">All</button>
<button onclick="filterProducts('Phones',this)">Phones</button>
<button onclick="filterProducts('Shoes',this)">Shoes</button>
<button onclick="filterProducts('Electronics',this)">Electronics</button>
</div>

<h2>Featured Products</h2>
<div style="padding:15px">
<button onclick="document.getElementById('addForm').style.display='block'"
style="background:#432080;color:white;padding:14px;border:0;border-radius:9px;width:100%;font-size:16px">
+ Add New Product
</button>
</div>

<div id="addForm" style="display:none;padding:15px;background:white;margin:15px;border-radius:12px">
<h2>Add Your Product</h2>

<input id="productName" placeholder="Product Name" style="width:100%;padding:12px;margin:8px 0">

<input id="productPrice" type="number" placeholder="Price in Pi" style="width:100%;padding:12px;margin:8px 0">

<input id="productImage" placeholder="Product Image URL" style="width:100%;padding:12px;margin:8px 0">

<textarea id="productDescription" placeholder="Product Description" style="width:100%;padding:12px;margin:8px 0"></textarea>

<button onclick="addProduct()" style="background:#432080;color:white;padding:12px;border:0;border-radius:8px;width:100%">
Publish Product
</button>
</div>
<div class="products">

<div class="product" data-category="Phones">
<img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500" alt="Smartphone">
<div class="info">
<h3>Smartphone</h3>
<p class="price">250 Pi</p>
<button onclick="showDetails('Smartphone','250 Pi','Modern smartphone with excellent features.','https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=700')">View Details</button>
</div>
</div>

<div class="product" data-category="Shoes">
<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Shoes">
<div class="info">
<h3>Sport Shoes</h3>
<p class="price">80 Pi</p>
<button onclick="showDetails('Sport Shoes','80 Pi','Comfortable sports shoes for everyday use.','https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=700')">View Details</button>
</div>
</div>

<div class="product" data-category="Electronics">
<img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="Headphones">
<div class="info">
<h3>Headphones</h3>
<p class="price">45 Pi</p>
<button onclick="showDetails('Headphones','45 Pi','Enjoy clear sound and comfortable listening.','https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=700')">View Details</button>
</div>
</div>

<div class="product" data-category="Electronics">
<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Smart Watch">
<div class="info">
<h3>Smart Watch</h3>
<p class="price">65 Pi</p>
<button onclick="showDetails('Smart Watch','65 Pi','Stylish smartwatch for daily activities.','https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=700')">View Details</button>
</div>
</div>

</div>
</div>

<div class="details" id="details">
<button class="back" onclick="goBack()">← Back to Products</button>
<img id="detailImage" src="" alt="Product">
<h2 id="detailName"></h2>
<h2 id="detailPrice"></h2>
<p id="detailDescription"></p>
<button class="contact" onclick="alert('Seller contact coming soon!')">Contact Seller</button>
</div>

<footer>
<p>π Pi Market © 2026</p>
<p>Powered by Pi Network</p>
</footer>

<script>
function showDetails(name,price,description,image){
document.getElementById('home').style.display='none';
document.getElementById('details').style.display='block';
document.getElementById('detailName').innerText=name;
document.getElementById('detailPrice').innerText=price;
document.getElementById('detailDescription').innerText=description;
document.getElementById('detailImage').src=image;
window.scrollTo(0,0);
}

function goBack(){
document.getElementById('details').style.display='none';
document.getElementById('home').style.display='block';
}

function searchProducts(){
let q=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.product').forEach(p=>{
p.style.display=p.innerText.toLowerCase().includes(q)?'block':'none';
});
}

function filterProducts(category,button){
document.querySelectorAll('.categories button').forEach(b=>b.classList.remove('active'));
button.classList.add('active');
document.querySelectorAll('.product').forEach(p=>{
p.style.display=(category==='All'||p.dataset.category===category)?'block':'none';
});
}function addProduct(){
let name=document.getElementById('productName').value.trim();
let price=document.getElementById('productPrice').value;
let image=document.getElementById('productImage').value.trim();
let description=document.getElementById('productDescription').value.trim();

if(!name || !price || !image || !description){
alert('Please fill in all fields');
return;
}

let product=document.createElement('div');
product.className='product';

product.innerHTML=`
<img src="${image}" alt="${name}">
<div class="info">
<h3>${name}</h3>
<p class="price">${price} Pi</p>
<button class="viewButton">View Details</button>
</div>
`;

product.querySelector('.viewButton').onclick=function(){
showDetails(name,price+' Pi',description,image);
};

document.querySelector('.products').prepend(product);

document.getElementById('addForm').style.display='none';

document.getElementById('productName').value='';
document.getElementById('productPrice').value='';
document.getElementById('productImage').value='';
document.getElementById('productDescription').value='';

alert('Product added successfully!');
}
</script>

</body>
</html>
