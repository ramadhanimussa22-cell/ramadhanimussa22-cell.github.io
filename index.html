
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5425a8">
<title>PioneerCart - Pi Market</title>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --purple:#5425a8;
  --dark:#29134d;
  --light:#f5f1fc;
  --white:#fff;
  --text:#252033;
  --muted:#777;
  --red:#d93636;
  --green:#16834a;
}
* {box-sizing:border-box}
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--light);
  color:var(--text);
}
header {
  background:linear-gradient(135deg,var(--dark),var(--purple));
  color:white;
  padding:22px 16px;
}
.top {
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.logo {font-size:23px;font-weight:bold}
.logo span {color:#ffd66b}
button {
  border:0;
  border-radius:9px;
  padding:12px 16px;
  font-weight:bold;
  cursor:pointer;
  background:var(--purple);
  color:white;
}
button:disabled {opacity:.6;cursor:not-allowed}
.login {background:#fff;color:var(--purple)}
main {max-width:1100px;margin:auto;padding:18px}
.welcome {
  background:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:18px;
}
h2 {margin-top:0;color:var(--dark)}
.status {font-size:14px;color:var(--muted);margin-top:8px}
.search {
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  margin:10px 0 20px;
}
.panel {
  background:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:22px;
}
input,textarea {
  width:100%;
  padding:13px;
  margin:7px 0 13px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:15px;
}
textarea {min-height:90px;resize:vertical}
label {font-size:14px;font-weight:bold}
.hint {font-size:12px;color:var(--muted)}
.preview {
  width:100%;
  max-height:220px;
  object-fit:contain;
  display:none;
  margin:10px 0;
  border-radius:10px;
}
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:16px;
}
.product {
  background:white;
  border-radius:13px;
  overflow:hidden;
  box-shadow:0 2px 9px #0000000d;
}
.product img {
  width:100%;
  height:190px;
  object-fit:cover;
  background:#eee;
}
.details {padding:14px}
.details h3 {margin:0 0 8px}
.price {color:var(--purple);font-size:19px;font-weight:bold}
.description {font-size:14px;color:#555;line-height:1.5}
.seller {font-size:12px;color:var(--muted)}
.actions {display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.whatsapp {background:#16834a;text-decoration:none;color:white;padding:11px;border-radius:8px;font-size:13px;font-weight:bold}
.delete {background:var(--red);font-size:13px}
.empty {text-align:center;color:var(--muted);padding:30px}
.notice {
  padding:12px;
  border-radius:8px;
  margin:10px 0;
  font-size:14px;
  display:none;
}
.error {background:#ffe9e9;color:#a21e1e}
.success {background:#e7f7ed;color:#176b3c}
footer {
  background:var(--dark);
  color:white;
  text-align:center;
  padding:25px;
  margin-top:35px;
  font-size:13px;
}
.hidden {display:none!important}
@media(max-width:500px) {
  .logo {font-size:20px}
  main {padding:12px}
  .grid {grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .product img {height:135px}
  .details {padding:10px}
  .details h3 {font-size:15px}
  .price {font-size:16px}
  .whatsapp {padding:9px;font-size:11px}
}
</style>
</head>

<body>

<header>
  <div class="top">
    <div class="logo">Pioneer<span>Cart</span></div>
    <button class="login" id="loginBtn" onclick="loginWithPi()">
      Login with Pi
    </button>
  </div>
</header>

<main>

  <section class="welcome">
    <h2>Welcome to PioneerCart</h2>
    <p>Discover products, connect with sellers and trade using the Pi ecosystem.</p>
    <div id="userStatus" class="status">You are browsing as a guest.</div>
    <div id="message" class="notice"></div>
    <button id="logoutBtn" class="hidden" onclick="logout()">Logout</button>
  </section>

  <section class="panel hidden" id="publishPanel">
    <h2>Publish Your Product</h2>

    <form id="productForm">
      <label>Product Name</label>
      <input id="productName" maxlength="100" required placeholder="Enter product name">

      <label>Description</label>
      <textarea id="productDescription" maxlength="2000" required placeholder="Describe your product"></textarea>

      <label>Price (Pi)</label>
      <input id="productPrice" type="number" min="0.01" step="0.01" required placeholder="Enter price in Pi">

      <label>WhatsApp Number</label>
      <input id="productWhatsapp" type="tel" maxlength="20" required placeholder="+255...">

      <label>Product Image</label>
      <input id="productImage" type="file" accept="image/jpeg,image/png,image/webp" required>
      <div class="hint">JPG, PNG or WebP. Maximum image size: 4 MB.</div>
      <img id="imagePreview" class="preview" alt="Product preview">

      <button id="publishBtn" type="submit">Publish Product</button>
    </form>
  </section>

  <section>
    <h2>Explore Products</h2>
    <input id="searchInput" class="search" type="search" placeholder="Search products..." oninput="renderProducts()">
    <div id="productGrid" class="grid">
      <div class="empty">Loading products...</div>
    </div>
  </section>

</main>

<footer>
  PioneerCart | Buy and Sell Easily with Pi
</footer>

<script>
const SUPABASE_URL = "https://gimditgfzeljttkcjupb.supabase.co";
const SUPABASE_KEY = "sb_publishable_R-cOF1TxuRLhtb3tG4rHXw_WuKqpHzF";
const FUNCTION_URL = SUPABASE_URL + "/functions/v1/pi-auth";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let piAccessToken = null;
let currentUser = null;
let products = [];
let piReady = false;

function showMessage(message, type = "success") {
  const box = document.getElementById("message");
  box.textContent = message;
  box.className = "notice " + type;
  box.style.display = "block";
}

function hideMessage() {
  document.getElementById("message").style.display = "none";
}

function updateLoginUI() {
  const loginBtn = document.getElementById("loginBtn");
  const publishPanel = document.getElementById("publishPanel");
  const logoutBtn = document.getElementById("logoutBtn");
  const userStatus = document.getElementById("userStatus");

  if (currentUser) {
    loginBtn.classList.add("hidden");
    publishPanel.classList.remove("hidden");
    logoutBtn.classList.remove("hidden");
    userStatus.textContent = "Logged in as Pi user: @" + currentUser.username;
  } else {
    loginBtn.classList.remove("hidden");
    publishPanel.classList.add("hidden");
    logoutBtn.classList.add("hidden");
    userStatus.textContent = "You are browsing as a guest.";
  }
}

async function callBackend(data) {
  const response = await fetch(FUNCTION_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY
    },
    body: JSON.stringify(data)
  });

  const result = await response.json().catch(() => ({}));

  if (!response.ok || !result.success) {
    throw new Error(result.error || "Server request failed");
  }

  return result;
}

async function initializePi() {
  if (!window.Pi) {
    showMessage("Pi SDK is unavailable. Please open this app in Pi Browser.", "error");
    return;
  }

  try {
    await window.Pi.init({
      version: "2.0",
      sandbox: true
    });
    piReady = true;
  } catch (error) {
    console.error("Pi initialization:", error);
    showMessage("Could not initialize Pi Network. Open this app in Pi Browser.", "error");
  }
}

async function loginWithPi() {
  hideMessage();

  if (!piReady || !window.Pi) {
    showMessage("Pi Network is not ready. Please open the app in Pi Browser.", "error");
    return;
  }

  const button = document.getElementById("loginBtn");
  button.disabled = true;
  button.textContent = "Connecting...";

  try {
    const auth = await window.Pi.authenticate(
      ["username"],
      function(incompletePayment) {
        console.log("Incomplete payment:", incompletePayment);
      }
    );

    if (!auth || !auth.accessToken) {
      throw new Error("Pi did not return an access token.");
    }

    const result = await callBackend({
      action: "verify",
      accessToken: auth.accessToken
    });

    piAccessToken = auth.accessToken;
    currentUser = {
      uid: result.uid,
      username: result.username
    };

    updateLoginUI();
    showMessage("Pi login successful. Welcome @" + currentUser.username);
    await loadProducts();

  } catch (error) {
    console.error("Pi login error:", error);
    showMessage(error.message || "Pi login failed.", "error");
  } finally {
    button.disabled = false;
    button.textContent = "Login with Pi";
  }
}

function logout() {
  piAccessToken = null;
  currentUser = null;
  updateLoginUI();
  showMessage("You have logged out.");
}

async function loadProducts() {
  const grid = document.getElementById("productGrid");
  grid.innerHTML = '<div class="empty">Loading products...</div>';

  const { data, error } = await db
    .from("products")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Product loading error:", error);
    grid.innerHTML = '<div class="empty">Could not load products. Please try again.</div>';
    return;
  }

  products = data || [];
  renderProducts();
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char];
  });
}

function renderProducts() {
  const grid = document.getElementById("productGrid");
  const search = document.getElementById("searchInput").value.trim().toLowerCase();

  const filtered = products.filter(product => {
    return (
      String(product.name || "").toLowerCase().includes(search) ||
      String(product.description || "").toLowerCase().includes(search)
    );
  });

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">No products found.</div>';
    return;
  }

  grid.innerHTML = filtered.map(product => {
    const ownProduct = currentUser &&
      product.seller_uid &&
      product.seller_uid === currentUser.uid;

    const phone = String(product.whatsapp || "").replace(/\D/g, "");
    const whatsappLink = phone
      ? "https://wa.me/" + phone
      : "";

    const image = product.image_url
      ? escapeHTML(product.image_url)
      : "";

    return `
      <article class="product">
        ${image
          ? `<img src="${image}" alt="${escapeHTML(product.name)}" loading="lazy">`
          : `<div class="empty">No image</div>`
        }
        <div class="details">
          <h3>${escapeHTML(product.name)}</h3>
          <div class="price">${escapeHTML(product.price)} Pi</div>
          <p class="description">${escapeHTML(product.description)}</p>
          <div class="seller">Seller: @${escapeHTML(product.seller_username || "Seller")}</div>
          <div class="actions">
            ${whatsappLink
              ? `<a class="whatsapp" href="${whatsappLink}" target="_blank" rel="noopener">WhatsApp Seller</a>`
              : ""
            }
            ${ownProduct
              ? `<button class="delete" onclick="deleteProduct(${Number(product.id)})">Delete</button>`
              : ""
            }
          </div>
        </div>
      </article>
    `;
  }).join("");
}

document.getElementById("productImage").addEventListener("change", function() {
  const file = this.files[0];
  const preview = document.getElementById("imagePreview");

  if (!file) {
    preview.style.display = "none";
    return;
  }

  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
    showMessage("Choose a JPG, PNG or WebP image.", "error");
    this.value = "";
    preview.style.display = "none";
    return;
  }

  if (file.size > 4 * 1024 * 1024) {
    showMessage("Image must be smaller than 4 MB.", "error");
    this.value = "";
    preview.style.display = "none";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
});

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Could not read image."));
    reader.readAsDataURL(file);
  });
}

document.getElementById("productForm").addEventListener("submit", async function(event) {
  event.preventDefault();
  hideMessage();

  if (!currentUser || !piAccessToken) {
    showMessage("Please login with Pi first.", "error");
    return;
  }

  const name = document.getElementById("productName").value.trim();
  const description = document.getElementById("productDescription").value.trim();
  const price = Number(document.getElementById("productPrice").value);
  const whatsapp = document.getElementById("productWhatsapp").value.trim();
  const imageFile = document.getElementById("productImage").files[0];

  if (!name || !description || !whatsapp || !imageFile || !Number.isFinite(price) || price <= 0) {
    showMessage("Please complete all product details.", "error");
    return;
  }

  if (imageFile.size > 4 * 1024 * 1024) {
    showMessage("Image must be smaller than 4 MB.", "error");
    return;
  }

  const button = document.getElementById("publishBtn");
  button.disabled = true;
  button.textContent = "Publishing...";

  try {
    const imageBase64 = await fileToBase64(imageFile);

    await callBackend({
      action: "create",
      accessToken: piAccessToken,
      name,
      description,
      price,
      whatsapp,
      imageBase64
    });

    this.reset();
    document.getElementById("imagePreview").style.display = "none";

    showMessage("Your product has been published successfully.");
    await loadProducts();

  } catch (error) {
    console.error("Publish error:", error);
    showMessage(error.message || "Could not publish product.", "error");
  } finally {
    button.disabled = false;
    button.textContent = "Publish Product";
  }
});

async function deleteProduct(productId) {
  if (!currentUser || !piAccessToken) {
    showMessage("Please login first.", "error");
    return;
  }

  if (!confirm("Are you sure you want to delete this product?")) {
    return;
  }

  try {
    await callBackend({
      action: "delete",
      accessToken: piAccessToken,
      productId
    });

    showMessage("Product deleted successfully.");
    await loadProducts();

  } catch (error) {
    console.error("Delete error:", error);
    showMessage(error.message || "Could not delete product.", "error");
  }
}

updateLoginUI();
initializePi();
loadProducts();
</script>

</body>
</html>
