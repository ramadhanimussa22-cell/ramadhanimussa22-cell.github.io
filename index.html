<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5425a8">
<title>Pi Market</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f3fa;color:#29233b}
header{background:linear-gradient(135deg,#5425a8,#854bd7);color:white;text-align:center;padding:28px 15px}
header h1{font-size:30px;margin-bottom:8px}
.container{width:94%;max-width:1000px;margin:22px auto}
.actions{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
input,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px;margin-bottom:12px}
#search{flex:1;min-width:150px;margin:0}
button{background:#632db4;color:white;border:0;border-radius:9px;padding:12px 16px;font-size:15px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.add-button{background:#f0aa16;color:#241900}
.form-box{display:none;background:white;padding:18px;border-radius:12px;margin-bottom:22px;box-shadow:0 3px 12px #0001}
.form-box h2{color:#5425a8;margin-bottom:15px}
textarea{height:95px;resize:vertical}
#imagePreview{display:none;width:100%;max-height:230px;object-fit:contain;margin:5px 0 15px;border-radius:10px;background:#eee}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:15px;margin-top:15px}
.product{background:white;border-radius:12px;overflow:hidden;box-shadow:0 3px 12px #0001}
.product img{width:100%;height:145px;object-fit:cover;background:#eee}
.info{padding:12px}
.info h3{font-size:16px;margin-bottom:8px;overflow-wrap:anywhere}
.price{color:#632db4;font-weight:bold;margin:10px 0}
.viewButton{width:100%;font-size:13px}
.message{text-align:center;padding:22px;color:#777;grid-column:1/-1}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:10;padding:20px;overflow:auto}
.modal-content{background:white;max-width:450px;margin:35px auto;padding:20px;border-radius:12px}
.modal-content img{width:100%;max-height:260px;object-fit:cover;border-radius:9px}
.modal-content h2{margin-top:12px}
.modal-content p{line-height:1.5;margin:12px 0;overflow-wrap:anywhere}
.close-button{background:#777;width:100%;margin-top:10px}
footer{text-align:center;padding:25px;color:#777;font-size:13px}
@media(max-width:380px){.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product img{height:120px}}
</style>
</head>

<body>

<header>
<h1>π Pi Market</h1>
<p>Buy and Sell Easily with Pi Network</p>
</header>

<main class="container">

<div class="actions">
<input id="search" type="search" placeholder="Search products..." oninput="searchProducts()">
<button class="add-button" onclick="toggleForm()">+ Add Product</button>
</div>

<section class="form-box" id="addForm">
<h2>Publish Your Product</h2>

<input id="productName" type="text" placeholder="Product name">
<input id="productPrice" type="number" min="0" step="any" placeholder="Price in Pi">

<label for="productImage" style="display:block;margin-bottom:10px;font-weight:bold">
Choose Product Image
</label>

<input id="productImage" type="file" accept="image/*" onchange="previewImage(event)">

<img id="imagePreview" alt="Image preview">

<textarea id="productDescription" placeholder="Product description"></textarea>

<button id="publishButton" onclick="addProduct()">Publish Product</button>
<button class="close-button" onclick="toggleForm()">Cancel</button>
</section>

<h2>Latest Products</h2>

<section class="products" id="products">
<p class="message">Loading products...</p>
</section>

</main>

<div class="modal" id="detailsModal" onclick="closeOnBackground(event)">
<div class="modal-content">
<img id="detailImage" src="" alt="Product image">
<h2 id="detailName"></h2>
<h3 class="price" id="detailPrice"></h3>
<p id="detailDescription"></p>
<button class="close-button" onclick="closeDetails()">Close</button>
</div>
</div>

<footer>
<p>Pi Market © 2026</p>
<p>Powered by Pi Network</p>
</footer>

<script>
const SUPABASE_URL = "https://gimditgfzeljttkcjupb.supabase.co";

const SUPABASE_KEY = "sb_publishable_R-cOF1TxuRLhtb3tG4rHXw_WuKqpHzF";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let allProducts = [];
let selectedImage = null;

function safeImage(url) {
  try {
    const parsed = new URL(url);
    if (parsed.protocol === "https:" || parsed.protocol === "http:") {
      return parsed.href;
    }
  } catch (e) {}

  return "https://placehold.co/400x300?text=Pi+Market";
}

function toggleForm() {
  const form = document.getElementById("addForm");
  form.style.display =
    form.style.display === "block" ? "none" : "block";
}

function previewImage(event) {
  const file = event.target.files[0];
  const preview = document.getElementById("imagePreview");

  if (!file) {
    selectedImage = null;
    preview.style.display = "none";
    return;
  }

  if (!file.type.startsWith("image/")) {
    alert("Please choose an image.");
    event.target.value = "";
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    alert("Image must be smaller than 5 MB.");
    event.target.value = "";
    return;
  }

  selectedImage = file;
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
}

async function loadProducts() {
  const container = document.getElementById("products");

  container.innerHTML =
    '<p class="message">Loading products...</p>';

  const { data, error } = await supabaseClient
    .from("products")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error(error);
    container.innerHTML =
      '<p class="message">Could not load products. Please refresh.</p>';
    return;
  }

  allProducts = data || [];
  displayProducts(allProducts);
}

function displayProducts(products) {
  const container = document.getElementById("products");

  if (!products.length) {
    container.innerHTML =
      '<p class="message">No products available yet.</p>';
    return;
  }

  container.innerHTML = "";

  products.forEach(function(product) {
    const card = document.createElement("article");
    card.className = "product";

    const img = document.createElement("img");
    img.src = safeImage(product.image_url);
    img.alt = product.name || "Product";

    img.onerror = function() {
      img.src = "https://placehold.co/400x300?text=Pi+Market";
    };

    const info = document.createElement("div");
    info.className = "info";

    const name = document.createElement("h3");
    name.textContent = product.name;

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = product.price + " Pi";

    const view = document.createElement("button");
    view.className = "viewButton";
    view.textContent = "View Details";

    view.onclick = function() {
      showDetails(product.id);
    };

    info.append(name, price, view);
    card.append(img, info);
    container.appendChild(card);
  });
}

function searchProducts() {
  const query = document
    .getElementById("search")
    .value.toLowerCase().trim();

  const filtered = allProducts.filter(function(product) {
    return String(product.name || "").toLowerCase().includes(query) ||
      String(product.description || "").toLowerCase().includes(query);
  });

  displayProducts(filtered);
}

async function addProduct() {
  const name = document.getElementById("productName").value.trim();
  const price = document.getElementById("productPrice").value;
  const description = document.getElementById("productDescription").value.trim();
  const button = document.getElementById("publishButton");

  if (!name || !price || !description || !selectedImage) {
    alert("Please fill in all fields and choose a product image.");
    return;
  }

  if (!Number.isFinite(Number(price)) || Number(price) <= 0) {
    alert("Please enter a valid price.");
    return;
  }

  button.disabled = true;
  button.textContent = "Uploading image...";

  try {
    const extension = selectedImage.name.split(".").pop().toLowerCase();

    const fileName = Date.now() + "-" +
      Math.random().toString(36).slice(2) + "." + extension;

    const { data: uploadData, error: uploadError } =
      await supabaseClient.storage
        .from("product-images")
        .upload(fileName, selectedImage, {
          cacheControl: "3600",
          upsert: false
        });

    if (uploadError) {
      throw uploadError;
    }

    const { data: publicData } = supabaseClient.storage
      .from("product-images")
      .getPublicUrl(uploadData.path);

    const imageUrl = publicData.publicUrl;

    button.textContent = "Saving product...";

    const { error: insertError } = await supabaseClient
      .from("products")
      .insert([{
        name: name,
        description: description,
        price: Number(price),
        image_url: imageUrl
      }]);

    if (insertError) {
      throw insertError;
    }

    alert("Product published successfully!");

    document.getElementById("productName").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productDescription").value = "";
    document.getElementById("productImage").value = "";

    selectedImage = null;

    const preview = document.getElementById("imagePreview");
    preview.src = "";
    preview.style.display = "none";

    document.getElementById("addForm").style.display = "none";

    await loadProducts();

  } catch (error) {
    console.error(error);
    alert("Could not publish product: " + (error.message || "Please try again."));
  } finally {
    button.disabled = false;
    button.textContent = "Publish Product";
  }
}

function showDetails(id) {
  const product = allProducts.find(function(item) {
    return String(item.id) === String(id);
  });

  if (!product) return;

  document.getElementById("detailImage").src =
    safeImage(product.image_url);

  document.getElementById("detailName").textContent =
    product.name;

  document.getElementById("detailPrice").textContent =
    product.price + " Pi";

  document.getElementById("detailDescription").textContent =
    product.description;

  document.getElementById("detailsModal").style.display = "block";
}

function closeDetails() {
  document.getElementById("detailsModal").style.display = "none";
}

function closeOnBackground(event) {
  if (event.target.id === "detailsModal") {
    closeDetails();
  }
}

loadProducts();
</script>

</body>
</html>
